name: Release

on:
  push:
    branches: [main]

# Everything is denied by default; each job asks for what it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs untrusted-ish code (bun install, build): read-only token, no secrets. Hands the files over as an artifact.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      sha_arm64: ${{ steps.sums.outputs.sha_arm64 }}
      sha_x64: ${{ steps.sums.outputs.sha_x64 }}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Build, sign, package (darwin arm64 + x64)
        run: ./scripts/build-release.sh "$VERSION"

      - name: Smoke test the native binary
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "dist/release/sbs-${VERSION}-darwin-arm64.tar.gz" -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/sbs" --version

      - id: sums
        working-directory: dist/release
        run: |
          echo "sha_arm64=$(grep "sbs-${VERSION}-darwin-arm64.tar.gz" checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_x64=$(grep "sbs-${VERSION}-darwin-x64.tar.gz" checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/release/*.tar.gz
            dist/release/checksums.txt
          if-no-files-found: error
          retention-days: 7

  # Never runs project code: only attests the built files and attaches them to the release.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the release
      id-token: write # build provenance (sigstore)
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz

      - name: Attach to the release (no overwrite)
        run: gh release upload "$TAG" release/*.tar.gz release/checksums.txt --repo "$GITHUB_REPOSITORY"

  homebrew:
    needs: [release-please, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read # the tap is written with a deploy key (write access to the tap only), not GITHUB_TOKEN
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      SHA_ARM64: ${{ needs.build.outputs.sha_arm64 }}
      SHA_X64: ${{ needs.build.outputs.sha_x64 }}
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }} # the template of the release, not main HEAD
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: zxcvbinz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Render formula
        run: |
          set -euo pipefail
          [ "$HAS_TAP_KEY" = "true" ] || { echo "HOMEBREW_TAP_DEPLOY_KEY secret is not set" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad version" >&2; exit 1; }
          [[ "$SHA_ARM64" =~ ^[0-9a-f]{64}$ && "$SHA_X64" =~ ^[0-9a-f]{64}$ ]] || { echo "bad sha256" >&2; exit 1; }
          mkdir -p tap/Formula
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA256_ARM64@|${SHA_ARM64}|g" \
              -e "s|@SHA256_X64@|${SHA_X64}|g" \
              packaging/homebrew/sbs.rb > tap/Formula/sbs.rb

      - name: Commit and push to the tap
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sbs.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "sbs ${VERSION}"
          git push
